name: Deploy Lightsail

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "배포하려면 DEPLOY를 입력하세요"
        required: true
        type: string
      run_migration:
        description: "PostgreSQL migration 실행"
        required: true
        default: true
        type: boolean

concurrency:
  group: lightsail-staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_OWNER: lh99tw

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/five-days-web:${{ github.sha }}
      - name: Build and push game server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.game
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/five-days-game-server:${{ github.sha }}
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Temporarily allow this runner to use SSH
        env:
          LIGHTSAIL_INSTANCE_NAME: ${{ secrets.LIGHTSAIL_INSTANCE_NAME }}
        run: |
          set -euo pipefail
          runner_cidr="$(curl --fail --silent https://checkip.amazonaws.com)/32"
          printf 'RUNNER_CIDR=%s\n' "$runner_cidr" >> "$GITHUB_ENV"
          aws lightsail open-instance-public-ports \
            --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
            --port-info "fromPort=22,toPort=22,protocol=TCP,cidrs=$runner_cidr"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 0600 ~/.ssh/id_rsa
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment topology
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_DEPLOY_USER: ${{ secrets.LIGHTSAIL_DEPLOY_USER }}
        run: |
          scp compose.yml Caddyfile \
            "$LIGHTSAIL_DEPLOY_USER@$LIGHTSAIL_HOST:/opt/five-days/"
      - name: Deploy SHA images
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_DEPLOY_USER: ${{ secrets.LIGHTSAIL_DEPLOY_USER }}
          IMAGE_SHA: ${{ github.sha }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MIGRATION: ${{ inputs.run_migration }}
        run: |
          ssh "$LIGHTSAIL_DEPLOY_USER@$LIGHTSAIL_HOST" \
            IMAGE_SHA="$IMAGE_SHA" IMAGE_OWNER="$IMAGE_OWNER" GHCR_READ_TOKEN="$GHCR_READ_TOKEN" RUN_MIGRATION="$RUN_MIGRATION" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/five-days
          current_web=$(awk -F= '/^WEB_IMAGE=/{print $2}' .release 2>/dev/null || true)
          current_game=$(awk -F= '/^GAME_IMAGE=/{print $2}' .release 2>/dev/null || true)
          saved_web=$(awk -F= '/^WEB_IMAGE=/{print $2}' .previous-release 2>/dev/null || true)
          saved_game=$(awk -F= '/^GAME_IMAGE=/{print $2}' .previous-release 2>/dev/null || true)
          previous_web="$current_web"
          previous_game="$current_game"
          if ! curl --fail --silent "https://$(awk -F= '/^WEB_HOST=/{print $2}' .env)/api/health/live" >/dev/null 2>&1 || \
             ! curl --fail --silent "https://$(awk -F= '/^GAME_HOST=/{print $2}' .env)/health/live" >/dev/null 2>&1; then
            previous_web="${saved_web:-$current_web}"
            previous_game="${saved_game:-$current_game}"
          fi
          printf 'WEB_IMAGE=%s\nGAME_IMAGE=%s\n' "$previous_web" "$previous_game" > .previous-release
          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$IMAGE_OWNER" --password-stdin
          web_image="ghcr.io/$IMAGE_OWNER/five-days-web:$IMAGE_SHA"
          game_image="ghcr.io/$IMAGE_OWNER/five-days-game-server:$IMAGE_SHA"
          printf 'WEB_IMAGE=%s\nGAME_IMAGE=%s\n' "$web_image" "$game_image" > .release
          set -a
          . ./.env
          . ./.release
          set +a
          rollback_release() {
            if [ -n "$previous_web" ] && [ -n "$previous_game" ]; then
              printf 'WEB_IMAGE=%s\nGAME_IMAGE=%s\n' "$previous_web" "$previous_game" > .release
              export WEB_IMAGE="$previous_web" GAME_IMAGE="$previous_game"
              docker compose up -d --remove-orphans
            fi
          }
          deployment_exit() {
            exit_code=$?
            trap - EXIT
            if [ "$exit_code" -ne 0 ]; then
              set +e
              docker compose logs --since=10m --tail=200 web game-server caddy fastlane-cert-sync
              rollback_release
            fi
            exit "$exit_code"
          }
          trap deployment_exit EXIT
          upsert_env() {
            file="$1"
            key="$2"
            value="$3"
            if grep -q "^${key}=" "$file"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$file"
            else
              printf '%s=%s\n' "$key" "$value" >> "$file"
            fi
          }
          fastlane_secret=$(awk -F= '/^FASTLANE_SECRET=/{sub(/^[^=]*=/, ""); print; exit}' .env.game)
          if [ "${#fastlane_secret}" -lt 32 ]; then
            fastlane_secret=$(openssl rand -base64 48 | tr -d '\n')
          fi
          upsert_env .env.web PROTOCOL_VERSION 3
          upsert_env .env.game PROTOCOL_VERSION 3
          upsert_env .env.game FASTLANE_ENABLED true
          upsert_env .env.game FASTLANE_HOST 0.0.0.0
          upsert_env .env.game FASTLANE_PORT 4433
          upsert_env .env.game FASTLANE_PUBLIC_URL "https://$GAME_HOST/fastlane"
          upsert_env .env.game FASTLANE_SECRET "$fastlane_secret"
          upsert_env .env.game FASTLANE_CERT_PATH /run/secrets/fastlane/tls.crt
          upsert_env .env.game FASTLANE_KEY_PATH /run/secrets/fastlane/tls.key
          upsert_env .env.game FASTLANE_MAINTENANCE_MS 10000
          chmod 0600 .env.web .env.game
          docker compose pull web game-server migrate
          if [ "$RUN_MIGRATION" = "true" ]; then
            # Keep the container from consuming the remaining remote script on stdin.
            docker compose --profile migration run --rm -T migrate </dev/null
          fi
          docker compose up -d --remove-orphans
          for attempt in $(seq 1 60); do
            game_live=$(curl --fail --silent "https://$GAME_HOST/health/live" 2>/dev/null || true)
            if curl --fail --silent "https://$WEB_HOST/api/health/ready" >/dev/null && \
               curl --fail --silent "https://$GAME_HOST/health/ready" >/dev/null && \
               printf '%s' "$game_live" | grep -q '"fastLane":{"state":"ready"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
          REMOTE
      - name: Close temporary SSH access
        if: ${{ always() && env.RUNNER_CIDR != '' }}
        env:
          LIGHTSAIL_INSTANCE_NAME: ${{ secrets.LIGHTSAIL_INSTANCE_NAME }}
        run: |
          aws lightsail close-instance-public-ports \
            --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
            --port-info "fromPort=22,toPort=22,protocol=TCP,cidrs=$RUNNER_CIDR"
