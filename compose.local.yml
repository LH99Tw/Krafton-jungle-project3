services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: five_days
      POSTGRES_PASSWORD: five_days_local
      POSTGRES_DB: five_days
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U five_days -d five_days"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-local:
