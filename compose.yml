services:
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_HOST: ${WEB_HOST}
      GAME_HOST: ${GAME_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      game-server:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-five-days-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env.web
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  game-server:
    image: ${GAME_IMAGE:-five-days-game-server:local}
    build:
      context: .
      dockerfile: Dockerfile.game
    env_file: .env.game
    expose: ["2567"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2567/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: ${GAME_IMAGE:-five-days-game-server:local}
    build:
      context: .
      dockerfile: Dockerfile.game
    profiles: ["migration"]
    env_file: .env.migration
    command: ["pnpm", "--filter", "@five-days/db", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17.6-alpine
    env_file: .env.postgres
    expose: ["5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
