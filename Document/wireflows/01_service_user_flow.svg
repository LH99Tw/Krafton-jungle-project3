<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1800" viewBox="0 0 2600 1800">
  <defs><style>text{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#18201e}.title{font-size:46px;font-weight:800}.sub{font-size:20px;fill:#59635f}.step{font-size:16px;font-weight:900;letter-spacing:2px;fill:#98772f}.screenTitle{font-size:24px;font-weight:800}.label{font-size:16px;font-weight:800}.small{font-size:14px;fill:#69736f}.tiny{font-size:11px;fill:#7e8883}.wire{fill:#fff;stroke:#aeb7b3;stroke-width:2}.panel{fill:#f2f4f2;stroke:#c8cfcc;stroke-width:2}.dark{fill:#18201e}.gold{fill:#d0a94f}.line{stroke:#27312e;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke:#83908a;stroke-width:3;stroke-dasharray:10 10;fill:none;marker-end:url(#s)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#27312e"/></marker><marker id="s" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#83908a"/></marker></defs>
  <rect width="2600" height="1800" fill="#e9ecea"/><text x="80" y="85" class="title">《5일 뒤 마왕》 Desktop Service User Flow</text><text x="80" y="125" class="sub">16:9 데스크톱 웹 기준 · 접속부터 로비 복귀까지의 실제 코드 레이아웃 와이어프레임</text><rect x="2140" y="60" width="380" height="62" rx="31" class="dark"/><text x="2330" y="99" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#fff">DESKTOP WEB · MIN 1280px</text>

  <!-- 01 ACCESS desktop -->
  <g transform="translate(80 230)"><text y="-45" class="step">01 / ACCESS</text><text y="-13" class="screenTitle">로그인 · 게스트 접속</text><rect width="720" height="405" rx="8" class="wire"/><rect width="205" height="405" class="dark"/><text x="25" y="36" style="font-size:13px;font-weight:800;fill:#fff">◇  5일 뒤 마왕</text><text x="25" y="122" style="font-size:10px;fill:#d0a94f">01 / ACCESS</text><text x="25" y="157" style="font-size:20px;font-weight:800;fill:#fff">작전 참가</text><rect x="25" y="185" width="155" height="35" fill="#eef0eb"/><text x="102" y="207" text-anchor="middle" class="tiny">Google 계정으로 계속</text><line x1="25" y1="244" x2="180" y2="244" stroke="#69736f"/><rect x="25" y="267" width="112" height="34" fill="none" stroke="#69736f"/><rect x="139" y="267" width="41" height="34" class="gold"/><text x="81" y="288" text-anchor="middle" style="font-size:10px;fill:#b9c1bd">게스트 작전명</text><text x="25" y="376" style="font-size:9px;fill:#82908a">● PROTOTYPE SERVER</text>
    <rect x="205" width="515" height="340" fill="#8d9692"/><rect x="230" y="40" width="465" height="268" fill="#747d79"/><circle cx="500" cy="155" r="72" fill="#59635f"/><text x="255" y="94" style="font-size:10px;font-weight:800;fill:#d0a94f">왕국 최후의 원정대 모집</text><text x="255" y="145" style="font-size:34px;font-weight:900;fill:#fff">마왕이 오기까지</text><text x="255" y="186" style="font-size:40px;font-weight:900;fill:#fff">단, 5일.</text><text x="255" y="230" style="font-size:12px;fill:#e0e5e2">세 명의 신참 용사가 함께 살아남습니다.</text><rect x="205" y="340" width="515" height="65" class="dark"/><text x="235" y="378" style="font-size:11px;fill:#b8c0bc">인증 완료 후 공개 원정대 탐색</text><rect x="550" y="351" width="145" height="42" class="gold"/><text x="622" y="377" text-anchor="middle" class="label">시작하기 →</text></g>

  <!-- 02 LOBBY desktop -->
  <g transform="translate(940 230)"><text y="-45" class="step">02 / LOBBY</text><text y="-13" class="screenTitle">방 목록 · 파티 채팅 · 준비</text><rect width="720" height="405" rx="8" class="wire"/><rect width="720" height="42" class="dark"/><text x="18" y="27" style="font-size:12px;font-weight:800;fill:#fff">V  5일 뒤 마왕</text><text x="360" y="27" text-anchor="middle" style="font-size:9px;fill:#aab3af">● LOBBY NETWORK</text><text x="690" y="27" text-anchor="end" style="font-size:9px;fill:#fff">OPERATOR</text>
    <rect y="42" width="185" height="363" class="panel"/><text x="15" y="72" class="label">파티 채널</text><g fill="#fff"><rect x="15" y="94" width="150" height="46"/><rect x="15" y="150" width="150" height="58"/></g><rect x="15" y="350" width="150" height="34" fill="#fff" stroke="#aeb7b3"/><text x="25" y="371" class="tiny">메시지 입력</text>
    <rect x="185" y="42" width="330" height="363" fill="#fff"/><text x="205" y="72" class="label">공개 원정대</text><rect x="430" y="55" width="66" height="25" class="gold"/><text x="463" y="71" text-anchor="middle" class="tiny">+ 방 만들기</text><g class="panel"><rect x="205" y="95" width="290" height="54"/><rect x="205" y="159" width="290" height="54"/><rect x="205" y="223" width="290" height="54"/></g><text x="225" y="119" class="tiny">새벽의 원정대</text><text x="455" y="134" class="tiny">1 / 3</text><rect x="380" y="345" width="115" height="38" class="dark"/><text x="437" y="368" text-anchor="middle" style="font-size:11px;fill:#fff">참가하기 →</text>
    <rect x="515" y="42" width="205" height="363" class="panel"/><text x="535" y="72" class="label">현재 파티</text><g fill="#fff" stroke="#c8cfcc"><rect x="535" y="95" width="165" height="62"/><rect x="535" y="167" width="165" height="62"/><rect x="535" y="239" width="165" height="62"/></g><text x="550" y="120" class="tiny">PLAYER · LEADER</text><text x="550" y="192" class="tiny">빈 슬롯  + AI 추가</text><text x="550" y="264" class="tiny">빈 슬롯  + AI 추가</text><rect x="535" y="318" width="72" height="32" fill="none" stroke="#98772f"/><text x="571" y="339" text-anchor="middle" class="tiny">준비</text><rect x="615" y="318" width="85" height="64" class="gold"/><text x="657" y="343" text-anchor="middle" style="font-size:10px;font-weight:800">캐릭터</text><text x="657" y="359" text-anchor="middle" style="font-size:10px;font-weight:800">선택 시작</text></g>

  <!-- 03 SELECT desktop -->
  <g transform="translate(1800 230)"><text y="-45" class="step">03 / CHARACTER SELECT</text><text y="-13" class="screenTitle">3인/AI 클래스 선택</text><rect width="720" height="405" rx="8" class="wire"/><rect width="720" height="42" class="dark"/><text x="20" y="27" style="font-size:12px;font-weight:800;fill:#fff">출전 클래스 선택</text><text x="700" y="27" text-anchor="end" style="font-size:9px;fill:#aab3af">같은 클래스 중복 선택 가능</text><g fill="#eef1ef" stroke="#c7ceca"><rect x="120" y="55" width="150" height="46"/><rect x="285" y="55" width="150" height="46"/><rect x="450" y="55" width="150" height="46"/></g><text x="195" y="82" text-anchor="middle" class="tiny">PLAYER · 선택 중</text><text x="360" y="82" text-anchor="middle" class="tiny">AI · 궁수</text><text x="525" y="82" text-anchor="middle" class="tiny">AI · 마법사</text>
    <polygon points="0,115 270,115 225,365 0,365" fill="#8b9490"/><polygon points="270,115 520,115 485,365 225,365" class="gold"/><polygon points="520,115 720,115 720,365 485,365" fill="#666f6b"/><circle cx="125" cy="215" r="48" fill="#606965"/><circle cx="370" cy="215" r="55" fill="#856e36"/><circle cx="610" cy="215" r="48" fill="#4f5854"/><text x="95" y="315" style="font-size:26px;font-weight:900;fill:#fff">궁수</text><text x="340" y="315" style="font-size:26px;font-weight:900">검사</text><text x="575" y="315" style="font-size:26px;font-weight:900;fill:#fff">마법사</text><rect y="365" width="720" height="40" class="dark"/><text x="20" y="390" style="font-size:10px;fill:#d0a94f">3 / 3 SELECTED · 전원 선택 시 자동 게임 시작</text></g>

  <!-- 04 PLAY bottom-right -->
  <g transform="translate(1800 930)"><text y="-45" class="step">04 / PLAY</text><text y="-13" class="screenTitle">5일 원정 플레이</text><rect width="720" height="405" rx="8" class="wire"/><rect width="720" height="405" fill="#8c9591"/><rect x="15" y="14" width="170" height="42" class="dark"/><text x="30" y="40" style="font-size:11px;fill:#fff">DAY 01 · 낮 02:40</text><rect x="525" y="14" width="175" height="62" fill="#fff" opacity=".92"/><text x="540" y="38" class="tiny">기지 HP 900 / 900</text><text x="540" y="58" class="tiny">공용 골드 120</text><path d="M75 320C170 280 200 175 335 205S530 120 650 80" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="8 10" opacity=".75"/><text x="42" y="345" style="font-size:12px;font-weight:800;fill:#fff">기지</text><text x="622" y="98" style="font-size:12px;font-weight:800;fill:#fff">마왕성</text><circle cx="350" cy="225" r="20" class="gold"/><circle cx="308" cy="250" r="14" fill="#e2e6e3"/><circle cx="392" cy="250" r="14" fill="#e2e6e3"/><rect x="15" y="320" width="200" height="70" class="dark"/><circle cx="48" cy="350" r="22" class="gold"/><text x="82" y="344" style="font-size:10px;fill:#fff">LV.3  HP 92/110</text><text x="82" y="366" style="font-size:10px;fill:#fff">EXP 14/20</text><g fill="#242b29"><rect x="500" y="337" width="45" height="45"/><rect x="555" y="337" width="45" height="45"/><rect x="610" y="337" width="45" height="45"/></g><text x="522" y="365" text-anchor="middle" style="fill:#fff">Q</text><text x="577" y="365" text-anchor="middle" style="fill:#fff">E</text><text x="632" y="365" text-anchor="middle" style="fill:#fff">⇧</text></g>

  <!-- 05 CLEAR bottom-middle -->
  <g transform="translate(940 930)"><text y="-45" class="step">05 / CLEAR</text><text y="-13" class="screenTitle">마왕 처치 · 클리어 연출</text><rect width="720" height="405" rx="8" class="wire"/><rect width="720" height="405" fill="#555e5a"/><circle cx="360" cy="170" r="82" fill="#29322f"/><path d="M310 170L348 210L425 125" fill="none" stroke="#d0a94f" stroke-width="16"/><text x="360" y="290" text-anchor="middle" style="font-size:34px;font-weight:900;fill:#fff">마왕 토벌 완료</text><text x="360" y="322" text-anchor="middle" style="font-size:12px;fill:#dfe4e1">DAY 05 · EXPEDITION CLEAR</text><rect x="285" y="345" width="150" height="40" class="gold"/><text x="360" y="370" text-anchor="middle" class="label">결과 확인</text></g>

  <!-- 06 RESULT bottom-left -->
  <g transform="translate(80 930)"><text y="-45" class="step">06 / RESULT</text><text y="-13" class="screenTitle">결과 모달 · 같은 방 복귀</text><rect width="720" height="405" rx="8" class="wire"/><rect width="720" height="405" fill="#555e5a"/><rect x="155" y="35" width="410" height="335" fill="#fff"/><text x="360" y="67" text-anchor="middle" class="tiny">EXPEDITION REPORT · DAY 05</text><circle cx="360" cy="105" r="26" class="gold"/><text x="360" y="113" text-anchor="middle" class="label">V</text><text x="360" y="155" text-anchor="middle" class="screenTitle">마왕 토벌 완료</text><rect x="190" y="178" width="340" height="46" class="panel"/><text x="360" y="199" text-anchor="middle" class="tiny">YOUR TITLE</text><text x="360" y="217" text-anchor="middle" class="label">원정대 에이스</text><g fill="#eef1ef"><rect x="190" y="238" width="105" height="45"/><rect x="303" y="238" width="105" height="45"/><rect x="416" y="238" width="114" height="45"/></g><text x="242" y="266" text-anchor="middle" class="tiny">피해량</text><text x="355" y="266" text-anchor="middle" class="tiny">처치 수</text><text x="473" y="266" text-anchor="middle" class="tiny">시설 기여</text><rect x="190" y="305" width="340" height="42" class="dark"/><text x="360" y="331" text-anchor="middle" style="font-size:12px;font-weight:800;fill:#fff">같은 파티 방으로 복귀</text></g>

  <!-- flow arrows -->
  <path d="M800 430H930" class="line"/><text x="865" y="408" text-anchor="middle" class="small">인증 완료</text><path d="M1660 430H1790" class="line"/><text x="1725" y="408" text-anchor="middle" class="small">3슬롯 준비</text><path d="M2160 640V910" class="line"/><text x="2180" y="782" class="small">전원 선택</text><path d="M1800 1130H1670" class="line"/><text x="1735" y="1108" text-anchor="middle" class="small">보스 처치</text><path d="M940 1130H810" class="line"/><text x="875" y="1108" text-anchor="middle" class="small">결산</text><path d="M440 1340V1470H1300V650" class="dash"/><text x="870" y="1502" text-anchor="middle" class="label">결과 확인 → 같은 lobby_room 유지 → 준비/선택 초기화</text>

  <rect x="80" y="1580" width="2440" height="130" rx="16" fill="#f8f9f8" stroke="#c8cfcc" stroke-width="2"/><text x="120" y="1625" class="label">핵심 예외</text><text x="120" y="1660" class="small">로그인 실패: 접속 화면 유지  ·  방 인원 부족: AI 슬롯 추가 가능  ·  선택 재클릭: 선택 취소  ·  기지 파괴/시간 초과: 패배 결과 모달  ·  멤버 이탈: 방장 이전 또는 AI 대체</text><text x="120" y="1692" class="small">게임 중에도 대기실 연결을 유지하며, 결과 버튼은 새 방 검색이 아니라 기존 파티방 복귀를 기본 행동으로 사용한다.</text>
</svg>
