<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1500" viewBox="0 0 2600 1500">
  <defs><style>text{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#17201d}.title{font-size:46px;font-weight:800}.sub{font-size:20px;fill:#5c6762}.h{font-size:25px;font-weight:800}.label{font-size:17px;font-weight:800}.body{font-size:15px;fill:#56615c}.tiny{font-size:12px;fill:#69746f}.cap{font-size:14px;font-weight:900;letter-spacing:2px;fill:#8f6e25}.box{fill:#fff;stroke:#bbc4c0;stroke-width:2}.soft{fill:#f2f4f2;stroke:#cbd2cf;stroke-width:2}.dark{fill:#1b2421}.gold{fill:#d1aa4e}.blue{fill:#94b6c5}.purple{fill:#ad98bb}.green{fill:#9fbaa6}.path{stroke:#29332f;stroke-width:5;fill:none;marker-end:url(#a)}.dash{stroke:#87938d;stroke-width:4;stroke-dasharray:12 10;fill:none;marker-end:url(#s)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#29332f"/></marker><marker id="s" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#87938d"/></marker></defs>
  <rect width="2600" height="1500" fill="#e8ebe9"/><text x="80" y="85" class="title">게임 플레이 내부 Flow ② — 성장·재화 획득과 사용</text><text x="80" y="125" class="sub">전투 행동이 경험치·골드·장비로 환원되고, 개인 성장과 공용 기지 성장으로 다시 전투력이 올라가는 폐쇄 루프</text>

  <!-- sources -->
  <text x="80" y="205" class="h">1. 전투에서 얻는다</text>
  <g transform="translate(80 245)"><rect width="500" height="250" rx="16" class="box"/><circle cx="92" cy="90" r="45" class="green"/><text x="92" y="98" text-anchor="middle" class="label">일반</text><text x="165" y="67" class="label">일반 몬스터</text><text x="165" y="99" class="body">경험치 + 소량 골드</text><text x="165" y="128" class="body">낮/밤 반복의 기본 성장원</text><rect x="30" y="177" width="440" height="40" class="soft"/><text x="250" y="202" text-anchor="middle" class="tiny">팀 공유 경험치 → 전원 같은 레벨 유지</text></g>
  <g transform="translate(620 245)"><rect width="500" height="250" rx="16" class="box"/><circle cx="92" cy="90" r="45" class="purple"/><text x="92" y="98" text-anchor="middle" class="label">ELITE</text><text x="165" y="67" class="label">엘리트 · 히든 몬스터</text><text x="165" y="99" class="body">대량 경험치 + 고등급 장비</text><text x="165" y="128" class="body">히든 몬스터는 최소 에픽 보장</text><rect x="30" y="177" width="440" height="40" class="soft"/><text x="250" y="202" text-anchor="middle" class="tiny">위험한 전투일수록 빌드 변곡점 제공</text></g>
  <g transform="translate(1160 245)"><rect width="500" height="250" rx="16" class="box"/><rect x="47" y="42" width="90" height="100" class="dark"/><path d="M47 72L92 28L137 72" class="gold"/><text x="165" y="67" class="label">게이트 파괴</text><text x="165" y="99" class="body">골드 + 구역 압박 감소</text><text x="165" y="128" class="body">웨이포인트/다음 구역 개방</text><rect x="30" y="177" width="440" height="40" class="soft"/><text x="250" y="202" text-anchor="middle" class="tiny">밤에 기지로 향하는 적 웨이브 약화</text></g>
  <g transform="translate(1700 245)"><rect width="500" height="250" rx="16" class="box"/><path d="M48 120L92 38L136 120Z" class="gold"/><circle cx="92" cy="98" r="20" fill="#fff"/><text x="165" y="67" class="label">상자 · 보스 보상</text><text x="165" y="99" class="body">장비 + 대량 골드 + 결과 기록</text><text x="165" y="128" class="body">희귀도에 따라 스탯/전용 옵션 강화</text><rect x="30" y="177" width="440" height="40" class="soft"/><text x="250" y="202" text-anchor="middle" class="tiny">노말 → 레어 → 에픽 → 레전더리 → 신화</text></g>
  <g transform="translate(2240 245)"><rect width="280" height="250" rx="16" class="dark"/><text x="140" y="55" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#d1aa4e">OUTPUT</text><text x="140" y="105" text-anchor="middle" style="font-size:24px;font-weight:900;fill:#fff">EXP</text><text x="140" y="145" text-anchor="middle" style="font-size:24px;font-weight:900;fill:#fff">GOLD</text><text x="140" y="185" text-anchor="middle" style="font-size:24px;font-weight:900;fill:#fff">ITEM</text><text x="140" y="220" text-anchor="middle" style="font-size:12px;fill:#9eaaa4">세 성장 축으로 분배</text></g>
  <path d="M580 370H610" class="path"/><path d="M1120 370H1150" class="path"/><path d="M1660 370H1690" class="path"/><path d="M2200 370H2230" class="path"/>

  <!-- split -->
  <path d="M2380 495V570H500V650" class="dash"/><path d="M2380 495V570H1300V650" class="dash"/><path d="M2380 495V570H2100V650" class="dash"/>
  <text x="80" y="635" class="h">2. 세 갈래로 사용한다</text>
  <g transform="translate(80 680)"><rect width="760" height="425" rx="18" class="box"/><text x="35" y="48" class="cap">A / EXPERIENCE</text><text x="35" y="88" class="h">개인 특성 · 전직 성장</text><rect x="35" y="125" width="690" height="70" class="soft"/><text x="60" y="153" class="label">레벨업 발생</text><text x="60" y="180" class="body">팀 경험치가 차면 각자 2~3개 특성 중 하나 선택</text><g transform="translate(35 225)"><rect width="210" height="135" rx="10" fill="#edf3ed" stroke="#aebdb1"/><text x="20" y="35" class="tiny">CHOICE 01</text><text x="20" y="68" class="label">공격력 강화</text><text x="20" y="98" class="body">기본 공격 + 피해</text></g><g transform="translate(275 225)"><rect width="210" height="135" rx="10" fill="#eef1f4" stroke="#aab7bd"/><text x="20" y="35" class="tiny">CHOICE 02</text><text x="20" y="68" class="label">스킬 가속</text><text x="20" y="98" class="body">Q / E 재사용 감소</text></g><g transform="translate(515 225)"><rect width="210" height="135" rx="10" fill="#f2edf4" stroke="#baadbf"/><text x="20" y="35" class="tiny">MILESTONE</text><text x="20" y="68" class="label">클래스 전직</text><text x="20" y="98" class="body">3·6·9레벨 분기</text></g><text x="35" y="400" class="body">효과: 투사체 수·범위·공격 주기·스킬 형태가 눈에 보이게 변화</text></g>
  <g transform="translate(920 680)"><rect width="760" height="425" rx="18" class="box"/><text x="35" y="48" class="cap">B / GOLD · SHARED</text><text x="35" y="88" class="h">공용 기지 건설 · 업그레이드</text><rect x="35" y="125" width="330" height="205" class="soft"/><rect x="75" y="190" width="86" height="96" class="dark"/><path d="M75 210L118 165L161 210" class="gold"/><text x="200" y="188" class="label">포탑</text><text x="200" y="220" class="body">자동 공격</text><text x="200" y="250" class="body">밤 웨이브 억제</text><text x="200" y="280" class="body">3단계 업그레이드</text><rect x="395" y="125" width="330" height="205" class="soft"/><rect x="430" y="190" width="105" height="96" fill="#8e9893"/><text x="570" y="188" class="label">장벽</text><text x="570" y="220" class="body">진입 경로 지연</text><text x="570" y="250" class="body">기지 피해 완충</text><text x="570" y="280" class="body">수리/강화 비용</text><rect x="35" y="350" width="690" height="46" fill="#f3ece0"/><text x="380" y="379" text-anchor="middle" class="body">공용 골드이므로 구매 로그·핑으로 팀 합의 지원</text></g>
  <g transform="translate(1760 680)"><rect width="760" height="425" rx="18" class="box"/><text x="35" y="48" class="cap">C / EQUIPMENT</text><text x="35" y="88" class="h">장비 획득 · 비교 · 장착</text><g transform="translate(35 125)"><rect width="210" height="195" class="soft"/><circle cx="105" cy="68" r="42" class="blue"/><text x="105" y="74" text-anchor="middle" class="label">무기</text><text x="20" y="135" class="body">공격력 / 공속</text><text x="20" y="166" class="body">클래스 전용 옵션</text></g><g transform="translate(275 125)"><rect width="210" height="195" class="soft"/><circle cx="105" cy="68" r="42" class="green"/><text x="105" y="74" text-anchor="middle" class="label">방어구</text><text x="20" y="135" class="body">체력 / 방어력</text><text x="20" y="166" class="body">생존 효과</text></g><g transform="translate(515 125)"><rect width="210" height="195" class="soft"/><circle cx="105" cy="68" r="42" class="purple"/><text x="105" y="74" text-anchor="middle" class="label">장신구</text><text x="20" y="135" class="body">이동 / 쿨다운</text><text x="20" y="166" class="body">조건부 효과</text></g><text x="35" y="358" class="body">획득 후 10초간 추천 대상과 현재 장비 대비 증감치 표시</text><text x="35" y="391" class="body">전용 무기는 해당 클래스만 장착 · 공용 인벤토리로 클릭 경쟁 방지</text></g>

  <!-- feedback -->
  <rect x="80" y="1190" width="2440" height="220" rx="18" class="dark"/><text x="120" y="1240" style="font-size:25px;font-weight:800;fill:#fff">3. 강화된 전투력은 더 위험한 구역과 더 큰 보상으로 연결된다</text>
  <g style="font-size:16px;font-weight:800"><text x="190" y="1320" style="fill:#fff">전투력 상승</text><text x="660" y="1320" style="fill:#fff">상위 구역 진입</text><text x="1130" y="1320" style="fill:#fff">엘리트·게이트 처치</text><text x="1640" y="1320" style="fill:#fff">고등급 보상</text><text x="2090" y="1320" style="fill:#fff">마왕 도전</text></g>
  <path d="M330 1345H600" stroke="#d1aa4e" stroke-width="6" marker-end="url(#a)"/><path d="M800 1345H1070" stroke="#d1aa4e" stroke-width="6" marker-end="url(#a)"/><path d="M1330 1345H1580" stroke="#d1aa4e" stroke-width="6" marker-end="url(#a)"/><path d="M1830 1345H2040" stroke="#d1aa4e" stroke-width="6" marker-end="url(#a)"/><path d="M2260 1370 C2260 1460 280 1460 280 1385" stroke="#87938d" stroke-width="4" stroke-dasharray="12 10" fill="none" marker-end="url(#s)"/>
  <text x="1300" y="1468" text-anchor="middle" style="font-size:15px;font-weight:800;fill:#e8ebe9">보스 도전 전까지 파밍 ↔ 소비 ↔ 강화 루프 반복 · 시간은 계속 흐름</text>
</svg>
