<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1250" viewBox="0 0 2200 1250">
  <defs>
    <style>
      text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17201d}.title{font-size:46px;font-weight:800}.sub{font-size:20px;fill:#5c6762}.cap{font-size:14px;font-weight:900;letter-spacing:2px;fill:#866b35}.h{font-size:25px;font-weight:800}.label{font-size:18px;font-weight:800}.body{font-size:15px;fill:#56615c}.tiny{font-size:13px;fill:#69746f}.box{fill:#fff;stroke:#bbc4c0;stroke-width:2}.soft{fill:#f2f4f2;stroke:#cbd2cf;stroke-width:2}.accent{fill:#c7aa67}.dark{fill:#1b2421}.path{stroke:#29332f;stroke-width:5;fill:none;marker-end:url(#arrow)}.dash{stroke:#87938d;stroke-width:4;stroke-dasharray:12 10;fill:none;marker-end:url(#softArrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#29332f"/></marker>
    <marker id="softArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#87938d"/></marker>
  </defs>
  <rect width="2200" height="1250" fill="#e8ebe8"/>
  <text x="80" y="82" class="title">게임플레이 성장 · 장비 보상 흐름</text>
  <text x="80" y="118" class="sub">재화 없이 전투·탐색 결과가 공유 레벨과 개인 장비로 직접 이어진다.</text>

  <g transform="translate(80 185)">
    <rect width="2040" height="360" rx="22" class="box"/>
    <text x="35" y="48" class="cap">A / SHARED PROGRESSION</text>
    <g transform="translate(40 90)"><rect width="380" height="210" rx="16" class="soft"/><text x="28" y="48" class="h">최초 몬스터 처치</text><text x="28" y="86" class="body">정적·히든 몬스터 XP</text><text x="28" y="116" class="body">침공 몬스터는 구역별 2 / 5 / 6 XP</text><text x="28" y="164" class="tiny">일반 몬스터 리스폰 보상 없음</text></g>
    <path d="M440 195H555" class="path"/>
    <g transform="translate(575 90)"><rect width="380" height="210" rx="16" class="soft"/><text x="28" y="48" class="h">게이트 전체 파괴</text><text x="28" y="86" class="body">구역별 완료 XP 318 / 631 / 901</text><text x="28" y="116" class="body">구역당 최초 한 번</text><text x="28" y="164" class="tiny">고정 콘텐츠 목표 10 / 18 / 25</text></g>
    <path d="M975 195H1090" class="path"/>
    <g transform="translate(1110 90)"><rect width="380" height="210" rx="16" class="soft"/><text x="28" y="48" class="h">공유 레벨 상승</text><text x="28" y="86" class="body">파티 XP와 레벨 공유</text><text x="28" y="116" class="body">최대 30레벨</text><text x="28" y="164" class="tiny">숨겨진 방 전체 공략 시 30</text></g>
    <path d="M1510 195H1625" class="path"/>
    <g transform="translate(1645 90)"><rect width="350" height="210" rx="16" class="dark"/><text x="28" y="48" class="h" style="fill:#fff">개인 증강 선택</text><text x="28" y="86" class="body" style="fill:#d7ded9">레벨마다 결정론적 3개 draft</text><text x="28" y="116" class="body" style="fill:#d7ded9">10 / 20 / 30 클래스 마일스톤</text><text x="28" y="164" class="tiny" style="fill:#b9c4be">일반 풀은 공격 증강 10종</text></g>
  </g>

  <g transform="translate(80 590)">
    <rect width="980" height="500" rx="22" class="box"/>
    <text x="35" y="48" class="cap">B / PERSONAL EQUIPMENT</text>
    <text x="35" y="88" class="h">장비 획득과 정리</text>
    <g transform="translate(35 125)"><rect width="270" height="180" rx="14" class="soft"/><text x="24" y="45" class="label">숨겨진 방</text><text x="24" y="80" class="body">히든 적 처치</text><text x="24" y="110" class="body">전설 80% / 신화 20%</text><text x="24" y="150" class="tiny">플레이어별 개인 드롭</text></g>
    <g transform="translate(355 125)"><rect width="270" height="180" rx="14" class="soft"/><text x="24" y="45" class="label">장비 보급 방</text><text x="24" y="80" class="body">중앙 최초 진입</text><text x="24" y="110" class="body">동일한 장비 등급표</text><text x="24" y="150" class="tiny">재입장·재접속 중복 없음</text></g>
    <path d="M305 215H350M625 215H670" class="dash"/>
    <g transform="translate(675 125)"><rect width="270" height="180" rx="14" class="dark"/><text x="24" y="45" class="label" style="fill:#fff">6칸 인벤토리</text><text x="24" y="80" class="body" style="fill:#d7ded9">장착 · 교체 · 폐기</text><text x="24" y="110" class="body" style="fill:#d7ded9">등급·드롭만으로 성장</text><text x="24" y="150" class="tiny" style="fill:#b9c4be">강화 단계 없음</text></g>
    <rect x="35" y="345" width="910" height="105" rx="12" fill="#f3ece0"/>
    <text x="60" y="382" class="label">인벤토리가 가득 찬 경우</text><text x="60" y="414" class="body">획득할 장비를 바닥에 유지 → 기존 장비 폐기 → 같은 드롭을 다시 획득</text>
  </g>

  <g transform="translate(1140 590)">
    <rect width="980" height="500" rx="22" class="box"/>
    <text x="35" y="48" class="cap">C / OPTIONAL ROOMS</text>
    <text x="35" y="88" class="h">재화와 무관한 선택 콘텐츠</text>
    <g transform="translate(35 125)"><rect width="270" height="180" rx="14" class="soft"/><text x="24" y="45" class="label">신전</text><text x="24" y="80" class="body">채널링 후 전투 보정</text><text x="24" y="110" class="body">서버가 상한 적용</text></g>
    <g transform="translate(355 125)"><rect width="270" height="180" rx="14" class="soft"/><text x="24" y="45" class="label">제단</text><text x="24" y="80" class="body">능력치 1.20 / 0.80 교환</text><text x="24" y="110" class="body">누적 범위 0.6~1.6</text></g>
    <g transform="translate(675 125)"><rect width="270" height="180" rx="14" class="soft"/><text x="24" y="45" class="label">함정 · 체크포인트</text><text x="24" y="80" class="body">일회 전투 / 개인 부활 지점</text><text x="24" y="110" class="body">서버 권위 상태</text></g>
    <rect x="35" y="345" width="910" height="105" rx="12" fill="#eef1ef"/>
    <text x="60" y="382" class="label">구형 제작 맵 호환</text><text x="60" y="414" class="body">shop · gold → resource / gamble → altar 로드 시 정규화 후 저장</text>
  </g>
  <text x="1100" y="1185" text-anchor="middle" class="tiny">밤 생존에는 별도 성장 보상이 없으며 장비는 구매·판매·강화하지 않는다.</text>
</svg>
